appId: com.nudzie.app
productName: Nudzie
copyright: © Nudzie

directories:
  buildResources: build
  output: dist

afterPack: scripts/ad-hoc-sign-mac.cjs

# Runs after electron-builder code-signs the app. scripts/notarize.js submits the
# signed .app to Apple's notary service — but only when the APPLE_* env vars are
# set (see .env.example / NOTARIZATION_SETUP.md). Until then it no-ops so builds
# still succeed. NOTE: `notarize: false` in the mac block below disables
# electron-builder's built-in notarizer so this hook is the single source of truth.
afterSign: scripts/notarize.js

files:
  - out/**/*
  - package.json
  - "!**/*.{ts,map}"
  # Bundle the Google OAuth client so end users get one-click "Connect Google"
  # with no setup. The file is gitignored (never committed); it's read at build
  # time from the project root and packaged into the app. For a Desktop OAuth
  # client the secret is not confidential (Google expects it embedded in the
  # distributed app). Absent at build time => simply not bundled.
  - oauth-credentials.json

# build/ is `directories.buildResources`, so electron-builder deliberately keeps
# it OUT of app.asar. The runtime still needs the tray + app icons from it, so
# copy just those into Contents/Resources/build — src/main/assets.ts resolves
# them from process.resourcesPath. Without this the tray image is empty, which
# renders as an INVISIBLE menu-bar icon.
extraResources:
  - from: build
    to: build
    filter:
      - tray.png
      - tray@2x.png
      - iconTemplate.png
      - iconTemplate@2x.png
      - icon.png

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization/Developer ID signing require Apple Developer credentials. The
  # afterPack hook still applies a free ad-hoc signature so the bundle is sealed.
  # Flip notarize to true once APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are set.
  notarize: false
  artifactName: ${productName}.${ext}
  target:
    - target: dmg
      arch: [universal]
    # zip is required for macOS auto-update (Squirrel.Mac updates from the zip).
    - target: zip
      arch: [universal]

win:
  icon: build/icon-win.png
  # Stable filename so the site can link .../releases/latest/download/Nudzie-Setup.exe
  artifactName: ${productName}-Setup.${ext}
  # Single x64 installer — runs natively on x64 and via emulation on ARM Windows.
  # appx is the Microsoft Store package; it is built by the same x64 pass but
  # only on a real Windows host (it shells out to makeappx.exe).
  target:
    - target: nsis
      arch: [x64]
    - target: appx
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Microsoft Store (MSIX) package. Identity values come from Partner Center —
# they must match the reserved app identity exactly or the upload is rejected.
#   Package Family Name: MehulSethia.Nudzie_sj9jbtkexfsya
#   Package SID: S-1-15-2-2408979726-3252515840-841101041-1938713983-374251602-264041479-3064754329
# The package is produced UNSIGNED on purpose: Microsoft re-signs it server-side
# with the Store certificate on submission, so signing it locally is pointless
# (and a self-signed one would be rejected). electron-builder logs
# "AppX is not signed / Windows Store only build" — that is the expected path.
# Tile artwork lives in build/appx (fixed location, see scripts/generate-appx-assets.cjs).
appx:
  identityName: MehulSethia.Nudzie
  publisher: CN=6DC7C83A-BDEA-426F-B6FD-34DC5E3F7DF3
  publisherDisplayName: Mehul Sethia
  applicationId: Nudzie
  displayName: Nudzie
  # Nudzie brand indigo — the tile background Windows composites the logo over.
  backgroundColor: "#6B5FF0"
  # Don't override the win artifactName (Nudzie-Setup.exe) for the Store package.
  artifactName: ${productName}-${version}.${ext}

dmg:
  # Versioned on purpose. A bare "Nudzie" volume name makes `hdiutil create`
  # fail with "Operation not permitted" on a machine that has previously mounted
  # a Nudzie.dmg — the /Volumes/Nudzie mount point picks up an association that
  # blocks re-creating it. Including the version keeps the name unique per
  # release, so the DMG build can't be broken by an earlier install.
  title: Nudzie ${version}
  window: { width: 600, height: 420 }
  iconSize: 112
  contents:
    - { x: 150, y: 175, type: file }
    - { x: 450, y: 175, type: link, path: /Applications }

# Release + auto-update feed. Binaries are published to the PUBLIC releases repo
# so downloads work without exposing the private source repo.
publish:
  provider: github
  owner: mehulsethia
  repo: nudzie-releases
  # Publish a live (non-draft) release so GitHub's /releases/latest/download/
  # links (the site's Download button) and the auto-updater resolve it.
  releaseType: release
