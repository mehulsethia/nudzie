name: Build & release installers

# Builds the macOS .dmg and Windows .exe and publishes them to the public
# `nudzie-releases` repo. Trigger by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Requires a repo secret RELEASE_TOKEN: a fine-grained PAT with
# "Contents: read and write" on mehulsethia/nudzie-releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bundle the Google OAuth client into the release so users get one-click
      # sign-in. Store the JSON as the repo secret GOOGLE_OAUTH_JSON (the contents
      # of oauth-credentials.json). Never committed to git.
      - name: Write Google OAuth credentials (if provided)
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then
            printf '%s' "$GOOGLE_OAUTH_JSON" > oauth-credentials.json
            echo "Wrote oauth-credentials.json"
          else
            echo "No GOOGLE_OAUTH_JSON secret set; building without bundled Google creds."
          fi

      - name: Build & publish (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }} -- --publish always
        env:
          # Publish target is the public releases repo (see electron-builder.yml).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # No Apple/Windows signing certs — build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
