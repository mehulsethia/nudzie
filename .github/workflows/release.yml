name: Build & release installers

# Builds the macOS .dmg/.zip and publishes them to the public
# `nudzie-releases` repo. Trigger by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Requires a repo secret RELEASE_TOKEN: a fine-grained PAT with
# "Contents: read and write" on mehulsethia/nudzie-releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish installers to nudzie-releases (leave OFF to test the signed build without releasing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bundle the Google OAuth client into the release so users get one-click
      # sign-in. Store the JSON as the repo secret GOOGLE_OAUTH_JSON (the contents
      # of oauth-credentials.json). Never committed to git.
      - name: Write Google OAuth credentials (if provided)
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then
            printf '%s' "$GOOGLE_OAUTH_JSON" > oauth-credentials.json
            echo "Wrote oauth-credentials.json"
          else
            echo "No GOOGLE_OAUTH_JSON secret set; building without bundled Google creds."
          fi

      # macOS ONLY — import the Developer ID Application certificate into the
      # runner's keychain so electron-builder can sign the .app. The `if` guard
      # keeps this off the Windows job entirely.
      - name: Import Developer ID certificate (macOS)
        if: matrix.platform == 'mac'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode the base64 secret back into a .p12 file.
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Create a temporary keychain and make it the default search list.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and allow codesign to use it without a UI prompt.
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add our keychain to the search list so electron-builder finds the cert.
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Skip the free ad-hoc signature so it doesn't clobber the real Developer
          # ID signature. scripts/ad-hoc-sign-mac.cjs early-returns on this. Written
          # to $GITHUB_ENV so it applies to the Build step below.
          echo "NUDZIE_SKIP_ADHOC_SIGN=1" >> "$GITHUB_ENV"

      # Tag pushes always publish. Manual (workflow_dispatch) runs publish only
      # when the `publish` input is checked; otherwise they build + sign +
      # notarize WITHOUT releasing, so signing can be validated safely.
      - name: Remove existing release assets for rerun
        if: github.event_name == 'push' || inputs.publish
        uses: actions/github-script@v7
        env:
          PLATFORM: ${{ matrix.platform }}
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const owner = 'mehulsethia'
            const repo = 'nudzie-releases'
            const tag = context.ref.replace('refs/tags/', '')
            const namesByPlatform = {
              mac: new Set([
                'Nudzie.dmg',
                'Nudzie.dmg.blockmap',
                'Nudzie.zip',
                'Nudzie.zip.blockmap',
                'latest-mac.yml',
              ]),
              win: new Set([
                'Nudzie-Setup.exe',
                'Nudzie-Setup.exe.blockmap',
                'latest.yml',
              ]),
            }
            const names = namesByPlatform[process.env.PLATFORM]
            if (!names) throw new Error(`Unknown platform: ${process.env.PLATFORM}`)

            let release
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag })
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing ${tag} release in ${owner}/${repo}; nothing to delete.`)
                return
              }
              throw error
            }

            for (const asset of release.data.assets) {
              if (!names.has(asset.name)) continue
              core.info(`Deleting existing ${asset.name} from ${tag}`)
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id })
            }

      # electron-builder owns the whole pipeline: sign -> notarize -> staple
      # (scripts/notarize.js afterSign hook) -> package dmg/zip -> generate
      # latest-mac.yml -> upload to nudzie-releases. Do NOT post-process the
      # packaged .app afterwards: re-signing or stripping the stapled ticket at
      # Contents/CodeResources is what broke v0.1.7-v0.1.19.
      - name: Build & publish (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }} -- --publish ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}
        env:
          # Publish target is the public releases repo (see electron-builder.yml).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # macOS signing/notarization — consumed by electron-builder + notarize.js
          # on the mac job. The Developer ID cert is auto-discovered from the
          # keychain imported in the step above.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      # Independent audit of what was actually packaged, against the DMG and the
      # updater ZIP rather than the staging app. Catches a missing staple, a lost
      # signature, or a broken Designated Requirement.
      - name: Audit packaged mac artifacts
        if: matrix.platform == 'mac'
        run: node scripts/audit-mac-artifacts.cjs

  # Microsoft Store package. Deliberately SEPARATE from the `build` job above:
  # it never publishes to nudzie-releases and never touches the auto-update feed.
  # The .appx (MSIX) is uploaded as a workflow artifact only — Microsoft signs it
  # server-side when it's submitted through Partner Center, so there is nothing
  # to sign here and nothing to release. Download it and upload it by hand.
  msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Google OAuth credentials (if provided)
        shell: bash
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then
            printf '%s' "$GOOGLE_OAUTH_JSON" > oauth-credentials.json
            echo "Wrote oauth-credentials.json"
          else
            echo "No GOOGLE_OAUTH_JSON secret set; building without bundled Google creds."
          fi

      # `--publish never` is load-bearing: without it a tag push would push the
      # Store package into the public releases repo alongside the installers.
      - name: Build unsigned MSIX
        run: npm run build:windows

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudzie-msix
          path: dist/*.appx
          if-no-files-found: error
