<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nudzie Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#5A64B0" />
    <style>
      :root {
        --bg: #f5f4ff;
        --paper: #fffef8;
        --ink: #202033;
        --muted: #6f6b86;
        --line: #222235;
        --purple: #6b5ff0;
        --green: #2fbf55;
        --red: #e45858;
        --yellow: #ffd65a;
        --soft: rgba(107, 95, 240, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 1px 1px, rgba(107, 95, 240, 0.1) 1px, transparent 0) 0 0 / 20px 20px,
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select { font: inherit; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .hidden { display: none !important; }
      .shell { max-width: 1240px; margin: 0 auto; padding: 28px; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); letter-spacing: 0; line-height: 1.05; }
      h2 { margin: 0 0 12px; font-size: 20px; }
      p { color: var(--muted); line-height: 1.5; }
      .login {
        width: min(440px, calc(100vw - 32px));
        margin: 10vh auto;
        padding: 28px;
        background: var(--paper);
        border: 4px solid var(--line);
        border-radius: 10px;
        box-shadow: 10px 10px 0 rgba(32, 32, 51, 0.2);
      }
      label { display: grid; gap: 8px; margin: 16px 0; color: var(--muted); font-weight: 700; }
      input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }
      .btn {
        min-height: 44px;
        padding: 0 16px;
        border: 3px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        box-shadow: 4px 4px 0 rgba(32, 32, 51, 0.2);
        cursor: pointer;
        font-weight: 800;
      }
      .btn.primary { background: var(--purple); color: #fff; }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .meta { color: var(--muted); font-size: 14px; }
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      .filters { display: flex; flex-direction: column; gap: 12px; margin: 18px 0 22px; }
      .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .filter-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        min-width: 62px;
      }
      .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
      .tab {
        min-height: 38px;
        padding: 0 14px;
        border: 3px solid var(--line);
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
        font-weight: 800;
      }
      .tab.active { background: var(--purple); color: #fff; }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .metric, .panel {
        background: var(--paper);
        border: 3px solid var(--line);
        border-radius: 8px;
        box-shadow: 5px 5px 0 rgba(32, 32, 51, 0.15);
      }
      .metric { padding: 16px; min-height: 112px; }
      .metric .label { color: var(--muted); font-weight: 800; font-size: 13px; text-transform: uppercase; }
      .metric .value { font-size: 30px; font-weight: 900; margin-top: 8px; overflow-wrap: anywhere; }
      .metric .sub { color: var(--muted); margin-top: 6px; font-size: 13px; }
      .panel { padding: 18px; margin-top: 16px; overflow: hidden; }
      .wide { grid-column: span 2; }
      .full { grid-column: 1 / -1; }
      .bar {
        height: 14px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        overflow: hidden;
      }
      .bar > span { display: block; height: 100%; background: var(--purple); }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th, td {
        padding: 11px 9px;
        border-bottom: 2px solid rgba(32, 32, 51, 0.12);
        text-align: left;
        vertical-align: top;
      }
      th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 8px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: #fff;
        font-size: 12px;
        font-weight: 900;
      }
      .pill.ok { background: #dff8e6; }
      .pill.bad { background: #ffe3e3; }
      .pill.warn { background: #fff2b8; }
      .error {
        margin-top: 12px;
        padding: 12px;
        border: 3px solid var(--red);
        border-radius: 8px;
        color: #7c1717;
        background: #ffe8e8;
      }
      .empty { padding: 16px; color: var(--muted); background: var(--soft); border-radius: 8px; }
      @media (max-width: 980px) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 640px) {
        .shell { padding: 18px; }
        header { align-items: flex-start; flex-direction: column; }
        .grid { grid-template-columns: 1fr; }
        .wide { grid-column: span 1; }
        table { min-width: 680px; }
        .table-wrap { overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <main id="login" class="login">
      <h1>Nudzie Admin</h1>
      <p>Private dashboard.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="email" required /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="loginBtn" class="btn primary" type="submit">Log in</button>
      </form>
      <div id="loginError" class="error hidden"></div>
    </main>

    <main id="dashboard" class="shell hidden">
      <header>
        <div>
          <h1>Nudzie Admin</h1>
          <div class="meta" id="generatedAt">Loading...</div>
        </div>
        <div class="top-actions">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
          <button class="btn" id="logoutBtn" type="button">Log out</button>
        </div>
      </header>

      <div class="filters">
        <div class="filter-row">
          <span class="filter-label">Mode</span>
          <div class="tabs">
            <button class="tab active" data-mode="live" type="button">Live</button>
            <button class="tab" data-mode="test" type="button">Test</button>
          </div>
        </div>
        <div class="filter-row">
          <span class="filter-label">Period</span>
          <div class="tabs" id="rangeTabs"></div>
        </div>
      </div>

      <section class="grid" id="metrics"></section>

      <section class="grid">
        <div class="panel wide">
          <h2>Downloads</h2>
          <div id="downloads"></div>
        </div>
        <div class="panel wide">
          <h2>License Utilization</h2>
          <div id="licenseHealth"></div>
        </div>
      </section>

      <section class="panel">
        <h2>Recent Payments</h2>
        <div class="table-wrap" id="paymentsTable"></div>
      </section>

      <section class="panel">
        <h2>Recent Licenses</h2>
        <div class="table-wrap" id="licensesTable"></div>
      </section>

      <div id="dashError" class="error hidden"></div>
    </main>

    <script>
      (function(){
        var INACTIVITY_LIMIT_MS=15*60*1000;
        var TOUCH_INTERVAL_MS=60*1000;
        var RANGES=[
          {id:'today',label:'Today'},
          {id:'7d',label:'Last 7 days'},
          {id:'30d',label:'Last 30 days'},
          {id:'3m',label:'Last 3 months'},
          {id:'6m',label:'Last 6 months'},
          {id:'1y',label:'Last 1 year'},
          {id:'all',label:'All time'}
        ];
        var state={data:null,mode:'live',range:'all'};
        var idleTimer=null;
        var idleWatching=false;
        var lastTouch=0;
        var login=document.getElementById('login');
        var dashboard=document.getElementById('dashboard');
        var loginForm=document.getElementById('loginForm');
        var loginBtn=document.getElementById('loginBtn');
        var loginError=document.getElementById('loginError');
        var dashError=document.getElementById('dashError');
        var metrics=document.getElementById('metrics');
        var downloads=document.getElementById('downloads');
        var licenseHealth=document.getElementById('licenseHealth');
        var rangeTabs=document.getElementById('rangeTabs');
        var paymentsTable=document.getElementById('paymentsTable');
        var licensesTable=document.getElementById('licensesTable');
        var generatedAt=document.getElementById('generatedAt');

        function show(el){el.classList.remove('hidden');}
        function hide(el){el.classList.add('hidden');}
        function money(value,currency){
          return new Intl.NumberFormat('en-US',{style:'currency',currency:currency||'USD'}).format(value||0);
        }
        function num(value){return new Intl.NumberFormat('en-US').format(value||0);}
        function date(value){return value?new Date(value).toLocaleString():'-';}
        function statusPill(status){
          var cls=status==='succeeded'||status==='active'?'ok':(status==='failed'||status==='disabled'||status==='expired'?'bad':'warn');
          return '<span class="pill '+cls+'">'+(status||'-')+'</span>';
        }
        async function readJson(res){
          var text=await res.text();
          if(!text) return {};
          try{return JSON.parse(text);}
          catch(_err){
            throw new Error('Server returned a non-JSON response. This usually means the API function crashed or is not deployed yet.');
          }
        }
        async function logout(){
          try{await fetch('/api/admin-logout',{method:'POST',credentials:'same-origin'});}
          catch(_err){}
          stopIdleWatch();
          hide(dashboard);show(login);
        }
        async function touchSession(){
          var now=Date.now();
          if(now-lastTouch<TOUCH_INTERVAL_MS) return;
          lastTouch=now;
          try{
            var res=await fetch('/api/admin-touch',{method:'POST',credentials:'same-origin'});
            if(res.status===401) await logout();
          }catch(_err){}
        }
        function resetIdleTimer(){
          if(dashboard.classList.contains('hidden')) return;
          if(idleTimer) window.clearTimeout(idleTimer);
          idleTimer=window.setTimeout(function(){logout();},INACTIVITY_LIMIT_MS);
          touchSession();
        }
        function startIdleWatch(){
          if(idleWatching){resetIdleTimer();return;}
          idleWatching=true;
          ['click','keydown','mousemove','scroll','touchstart'].forEach(function(eventName){
            window.addEventListener(eventName,resetIdleTimer,{passive:true});
          });
          resetIdleTimer();
        }
        function stopIdleWatch(){
          if(idleTimer) window.clearTimeout(idleTimer);
          idleTimer=null;
          idleWatching=false;
          ['click','keydown','mousemove','scroll','touchstart'].forEach(function(eventName){
            window.removeEventListener(eventName,resetIdleTimer);
          });
        }
        function currentMode(){
          var modes=(state.data&&state.data.modes)||[];
          return modes.find(function(m){return m.mode===state.mode;})||modes[0]||null;
        }
        function currentRange(){
          return RANGES.find(function(r){return r.id===state.range;})||RANGES[RANGES.length-1];
        }
        // Boundaries are computed in the viewer's local timezone, so "Today" means
        // today where you are, not UTC.
        function rangeStart(id){
          var now=new Date();
          if(id==='today'){var d=new Date(now);d.setHours(0,0,0,0);return d.getTime();}
          if(id==='all') return 0;
          var months={'3m':3,'6m':6,'1y':12}[id];
          if(months){var m=new Date(now);m.setMonth(m.getMonth()-months);return m.getTime();}
          var days={'7d':7,'30d':30}[id]||0;
          return now.getTime()-days*24*60*60*1000;
        }
        function inRange(row,start){
          if(!start) return true;
          var t=row.date?new Date(row.date).getTime():0;
          return isFinite(t)&&t>=start;
        }
        function summarize(mode,start){
          var payments=(mode.payments||[]).filter(function(p){return inRange(p,start);});
          var licenses=(mode.licenses||[]).filter(function(l){return inRange(l,start);});
          var succeeded=payments.filter(function(p){return p.status==='succeeded';});
          var refunded=payments.filter(function(p){return p.refundStatus&&p.refundStatus!=='none';});
          var revenue=succeeded.reduce(function(sum,p){return sum+(p.amount||0);},0);
          var activations=licenses.reduce(function(sum,l){return sum+(l.activations||0);},0);
          var customers={};
          payments.forEach(function(p){var k=p.email||p.customerId;if(k) customers[k]=true;});
          return {
            mode:mode.mode,
            configured:mode.configured,
            productId:mode.productId,
            currency:(succeeded[0]&&succeeded[0].currency)||(payments[0]&&payments[0].currency)||'USD',
            payments:payments.length,
            paidOrders:succeeded.length,
            failedPayments:payments.filter(function(p){return p.status==='failed';}).length,
            cancelledPayments:payments.filter(function(p){return p.status==='cancelled';}).length,
            refundedPayments:refunded.length,
            customers:Object.keys(customers).length,
            revenue:Math.round(revenue*100)/100,
            avgOrder:succeeded.length?Math.round((revenue/succeeded.length)*100)/100:0,
            licenses:licenses.length,
            activeLicenses:licenses.filter(function(l){return l.status==='active';}).length,
            disabledLicenses:licenses.filter(function(l){return l.status==='disabled';}).length,
            expiredLicenses:licenses.filter(function(l){return l.status==='expired';}).length,
            activatedDevices:activations,
            unactivatedLicenses:licenses.filter(function(l){return (l.activations||0)===0;}).length,
            licenseUtilization:licenses.length?Math.round((activations/licenses.length)*100):0,
            recentPayments:payments.slice(0,12),
            recentLicenses:licenses.slice(0,12)
          };
        }
        function metric(label,value,sub){
          return '<div class="metric"><div class="label">'+label+'</div><div class="value">'+value+'</div><div class="sub">'+(sub||'')+'</div></div>';
        }
        function renderRangeTabs(){
          rangeTabs.innerHTML=RANGES.map(function(r){
            return '<button class="tab'+(r.id===state.range?' active':'')+'" data-range="'+r.id+'" type="button">'+r.label+'</button>';
          }).join('');
          rangeTabs.querySelectorAll('.tab').forEach(function(tab){
            tab.addEventListener('click',function(){state.range=tab.dataset.range;render();});
          });
        }
        function renderMetrics(s,rangeLabel){
          metrics.innerHTML=[
            metric('Revenue',money(s.revenue,s.currency),rangeLabel),
            metric('Paid Orders',num(s.paidOrders),money(s.avgOrder,s.currency)+' average order'),
            metric('Customers',num(s.customers),num(s.payments)+' payment attempts'),
            metric('Active Licenses',num(s.activeLicenses),num(s.licenses)+' licenses issued'),
            metric('Activated Devices',num(s.activatedDevices),num(s.unactivatedLicenses)+' unactivated licenses'),
            metric('Failed/Cancelled',num(s.failedPayments+s.cancelledPayments),num(s.refundedPayments)+' refunded/partial refund'),
            metric('Mode',s.mode.toUpperCase(),s.configured?'Dodo API configured':'Dodo API missing'),
            metric('Product',s.productId,'Nudzie Pro')
          ].join('');
        }
        function renderDownloads(data){
          var d=data.downloads||{assets:[]};
          if(!d.configured&&d.error){downloads.innerHTML='<div class="empty">'+d.error+'</div>';return;}
          var rows=(d.assets||[]).map(function(a){
            return '<tr><td class="mono">'+a.name+'</td><td>'+num(a.downloads)+'</td><td>'+date(a.updatedAt)+'</td></tr>';
          }).join('');
          var releases=(d.releases||[]).map(function(r){
            return '<tr><td class="mono">'+r.release+'</td><td>'+num(r.downloads)+'</td><td>'+date(r.publishedAt)+'</td></tr>';
          }).join('');
          downloads.innerHTML=
            '<div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px">'+
              metric('Total',num(d.total),'across '+num(d.releaseCount)+' releases')+
              metric('macOS',num(d.mac),'.dmg downloads')+
              metric('Windows',num(d.windows),'.exe downloads')+
              metric('Updater',num(d.other),'.zip / .yml / blockmaps')+
            '</div>'+
            '<div class="meta">Latest: '+(d.release||'-')+' / '+(d.publishedAt?date(d.publishedAt):'-')+'</div>'+
            '<div class="table-wrap"><table><thead><tr><th>Asset (all releases)</th><th>Downloads</th><th>Last updated</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
            (releases?'<div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Release</th><th>Downloads</th><th>Published</th></tr></thead><tbody>'+releases+'</tbody></table></div>':'')+
            '<p class="note">Lifetime totals. GitHub reports only a cumulative counter per asset with no timestamps, so downloads ignore the period filter. Counters also reset whenever an asset is re-uploaded to a release.</p>';
        }
        function renderLicenseHealth(s,rangeLabel){
          var pct=Math.max(0,Math.min(100,s.licenseUtilization||0));
          licenseHealth.innerHTML=
            '<p class="meta">Activation usage across licenses issued in this period ('+rangeLabel.toLowerCase()+').</p>'+
            '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
            '<p><b>'+pct+'%</b> utilization / '+num(s.activatedDevices)+' active device activations over '+num(s.licenses)+' licenses.</p>'+
            '<p>'+num(s.disabledLicenses)+' disabled / '+num(s.expiredLicenses)+' expired / '+num(s.unactivatedLicenses)+' not activated yet.</p>';
        }
        function table(rows,columns,empty){
          if(!rows||!rows.length) return '<div class="empty">'+empty+'</div>';
          return '<table><thead><tr>'+columns.map(function(c){return '<th>'+c.label+'</th>';}).join('')+'</tr></thead><tbody>'+
            rows.map(function(r){return '<tr>'+columns.map(function(c){return '<td>'+c.render(r)+'</td>';}).join('')+'</tr>';}).join('')+
            '</tbody></table>';
        }
        function renderTables(mode,rangeLabel){
          paymentsTable.innerHTML=table(mode.recentPayments,[
            {label:'Date',render:function(r){return date(r.date);}},
            {label:'Customer',render:function(r){return r.email||'-';}},
            {label:'Amount',render:function(r){return money(r.amount,r.currency);}},
            {label:'Status',render:function(r){return statusPill(r.status);}},
            {label:'Refund',render:function(r){return r.refundStatus||'-';}},
            {label:'Payment ID',render:function(r){return '<span class="mono">'+(r.id||'-')+'</span>';}}
          ],'No payments in this period ('+rangeLabel.toLowerCase()+').');
          licensesTable.innerHTML=table(mode.recentLicenses,[
            {label:'Date',render:function(r){return date(r.date);}},
            {label:'Key',render:function(r){return '<span class="mono">'+(r.key||'-')+'</span>';}},
            {label:'Status',render:function(r){return statusPill(r.status);}},
            {label:'Activations',render:function(r){return num(r.activations)+' / '+(r.activationLimit==null?'unlimited':num(r.activationLimit));}},
            {label:'Payment ID',render:function(r){return '<span class="mono">'+(r.paymentId||'-')+'</span>';}},
            {label:'License ID',render:function(r){return '<span class="mono">'+(r.id||'-')+'</span>';}}
          ],'No licenses in this period ('+rangeLabel.toLowerCase()+').');
        }
        function render(){
          var mode=currentMode();
          if(!mode) return;
          var range=currentRange();
          var summary=summarize(mode,rangeStart(range.id));
          generatedAt.textContent='Generated '+date(state.data.generatedAt)+' - '+state.data.admin;
          document.querySelectorAll('.tab[data-mode]').forEach(function(tab){tab.classList.toggle('active',tab.dataset.mode===state.mode);});
          renderRangeTabs();
          renderMetrics(summary,range.label);
          renderDownloads(state.data);
          renderLicenseHealth(summary,range.label);
          renderTables(summary,range.label);
        }
        async function loadData(){
          hide(dashError);
          var res=await fetch('/api/admin-data',{credentials:'same-origin'});
          if(res.status===401){hide(dashboard);show(login);return;}
          var data=await readJson(res);
          if(!res.ok) throw new Error(data.error||'Could not load admin data.');
          state.data=data;
          hide(login);show(dashboard);
          startIdleWatch();
          if(!currentMode()) state.mode=(data.modes&&data.modes[0]&&data.modes[0].mode)||'live';
          render();
        }
        loginForm.addEventListener('submit',async function(e){
          e.preventDefault();
          hide(loginError);
          loginBtn.disabled=true;
          try{
            var res=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
            var data=await readJson(res);
            if(!res.ok) throw new Error(data.error||'Login failed.');
            await loadData();
          }catch(err){
            loginError.textContent=err.message||'Login failed.';
            show(loginError);
          }finally{
            loginBtn.disabled=false;
          }
        });
        document.getElementById('refreshBtn').addEventListener('click',function(){loadData().catch(function(err){dashError.textContent=err.message;show(dashError);});});
        document.getElementById('logoutBtn').addEventListener('click',async function(){
          await logout();
        });
        document.querySelectorAll('.tab[data-mode]').forEach(function(tab){
          tab.addEventListener('click',function(){state.mode=tab.dataset.mode;render();});
        });
        loadData().catch(function(){show(login);});
      })();
    </script>
  </body>
</html>
